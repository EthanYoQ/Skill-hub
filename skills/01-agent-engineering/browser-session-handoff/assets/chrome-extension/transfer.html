<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Chrome 登录迁移</title>
<body style="width: 360px; padding: 12px; font: 14px system-ui">
  <h1>Chrome 登录迁移</h1>
  <p><label>平台
    <select id="site">
      <option value="douyin">抖音</option>
      <option value="xiaohongshu">小红书</option>
      <option value="zhihu">知乎</option>
      <option value="tiktok">TikTok</option>
    </select>
  </label></p>
  <p><label>加密口令 <input id="password" type="password" autocomplete="off" minlength="16"></label></p>
  <p>使用密码管理器生成至少 16 字符的随机口令。两端使用同一口令。</p>
  <p><button id="export" type="button">导出加密包</button></p>
  <p><label>加密包 <input id="file" type="file" accept=".json,application/json"></label></p>
  <p><button id="import" type="button">导入到空白专用配置</button></p>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="transfer.mjs"></script>
</body>
</html>
